      <script type="text/javascript">
        var seconds = 120;
        var timer;

        function startCountdown() {
            seconds = 120;
            document.getElementById("btnResend").disabled = true;
            timer = setInterval(function () {
                seconds--;
                document.getElementById("lblTimer").innerHTML =
                    "Resend OTP in " + seconds + " sec";

                if (seconds <= 0) {
                    clearInterval(timer);
                    document.getElementById("btnResend").disabled = false;
                    document.getElementById("lblTimer").innerHTML = "";
                    //document.getElementById("lblMsg2").innerHTML = "";
                    document.getElementById("lblMsg").innerHTML = "";

                }
            }, 1000);
        }

    </script>
